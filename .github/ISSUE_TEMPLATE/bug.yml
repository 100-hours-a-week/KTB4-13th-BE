name: Bug Report
description: 버그를 제보합니다.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: 발생한 버그를 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: agent-prompt
    attributes:
      label: Agent prompt
      description: 구현 에이전트가 바로 작업할 수 있도록 작업 대상, 관련 경로, 제약, 검증 방법을 명령형으로 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: 이슈가 완료되었다고 판단할 수 있는 관찰 가능한 조건을 체크리스트로 작성해주세요.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: 이번 이슈에서 다루지 않을 작업을 작성해주세요. 해당 사항이 없으면 '없음'이라고 적어주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: 버그를 재현하는 단계를 작성해주세요.
      value: |
        1.
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: 기대하는 동작을 설명해주세요.
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: 참고 사항이 있다면 작성해주세요.
    validations:
      required: false
