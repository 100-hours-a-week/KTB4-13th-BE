name: Chore
description: 리팩토링, 설정 변경 등 기술적 작업을 요청합니다.
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: 작업 내용을 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: agent-prompt
    attributes:
      label: Agent prompt
      description: 구현 에이전트가 바로 작업할 수 있도록 작업 대상, 관련 경로, 제약, 검증 방법을 명령형으로 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: 이슈가 완료되었다고 판단할 수 있는 관찰 가능한 조건을 체크리스트로 작성해주세요.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: 이번 이슈에서 다루지 않을 작업을 작성해주세요. 해당 사항이 없으면 '없음'이라고 적어주세요.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: 작업 항목을 체크리스트로 작성해주세요.
      value: |
        - [ ]
    validations:
      required: false
