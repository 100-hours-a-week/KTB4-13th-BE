name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: ECR에 게시된 Git 커밋 SHA 태그
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-cd
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend server
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_CD_ROLE_ARN: ${{ vars.AWS_CD_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      BACKEND_EC2_INSTANCE_ID: ${{ vars.BACKEND_EC2_INSTANCE_ID }}
      BACKEND_DEPLOY_DIR: ${{ vars.BACKEND_DEPLOY_DIR }}
      BACKEND_COMPOSE_FILE: ${{ vars.BACKEND_COMPOSE_FILE || 'compose.backend.yml' }}
      BACKEND_SERVICE_NAME: ${{ vars.BACKEND_SERVICE_NAME || 'backend' }}
      BACKEND_HEALTHCHECK_URL: ${{ vars.BACKEND_HEALTHCHECK_URL || 'http://127.0.0.1:8080/api/v1/categories' }}

    steps:
      - name: Check out trusted deployment script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Resolve release
        id: release
        env:
          MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
          PUBLISHED_IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            image_tag="$MANUAL_IMAGE_TAG"
          else
            image_tag="$PUBLISHED_IMAGE_TAG"
          fi

          if ! [[ "$image_tag" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::image_tag는 7~40자의 Git 커밋 SHA여야 합니다."
            exit 1
          fi

          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=${image_tag:0:7}" >> "$GITHUB_OUTPUT"

      - name: Validate deployment configuration
        run: |
          required=(
            AWS_REGION
            AWS_CD_ROLE_ARN
            ECR_REPOSITORY
            BACKEND_EC2_INSTANCE_ID
            BACKEND_DEPLOY_DIR
            BACKEND_COMPOSE_FILE
            BACKEND_SERVICE_NAME
            BACKEND_HEALTHCHECK_URL
          )

          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Variable $name 값이 없습니다."
              exit 1
            fi
          done

          [[ "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]]
          [[ "$ECR_REPOSITORY" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$BACKEND_EC2_INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]]
          [[ "$BACKEND_DEPLOY_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$BACKEND_COMPOSE_FILE" =~ ^[A-Za-z0-9._/-]+\.ya?ml$ ]]
          [[ "$BACKEND_COMPOSE_FILE" != *".."* ]]
          [[ "$BACKEND_SERVICE_NAME" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$BACKEND_HEALTHCHECK_URL" =~ ^http://(127\.0\.0\.1|localhost)(:[0-9]+)?/[A-Za-z0-9._/-]*$ ]]

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve ECR image digest
        id: image
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          read -r image_digest registry_id <<< "$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].[imageDigest,registryId]' \
            --output text)"

          if ! [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]] ||
            ! [[ "$registry_id" =~ ^[0-9]{12}$ ]]; then
            echo "::error::ECR 이미지 Digest를 확인할 수 없습니다."
            exit 1
          fi

          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"
          echo "ecr_registry=$registry_id.dkr.ecr.$AWS_REGION.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Deploy through SSM
        env:
          ECR_REGISTRY: ${{ steps.image.outputs.ecr_registry }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          ecr_registry="$ECR_REGISTRY"
          image_uri="$ecr_registry/$ECR_REPOSITORY@$IMAGE_DIGEST"
          encoded_script=$(base64 --wrap=0 scripts/deploy_backend.sh)

          remote_command=$(cat <<EOF
          set -eu
          umask 077

          remote_script=\$(mktemp /tmp/deploy-backend-ssm.XXXXXX)
          trap 'rm -f "\$remote_script"' EXIT

          printf '%s' '$encoded_script' | base64 -d > "\$remote_script"
          chmod 700 "\$remote_script"

          "\$remote_script" \
            '$BACKEND_DEPLOY_DIR' \
            '$BACKEND_COMPOSE_FILE' \
            '$BACKEND_SERVICE_NAME' \
            '$image_uri' \
            '$RELEASE_SHA' \
            '$AWS_REGION' \
            '$ecr_registry' \
            '$BACKEND_HEALTHCHECK_URL'
          EOF
          )
          parameters=$(jq -cn --arg command "$remote_command" '{commands: [$command]}')

          command_id=$(aws ssm send-command \
            --instance-ids "$BACKEND_EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy backend $RELEASE_SHA" \
            --timeout-seconds 900 \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)

          deadline=$((SECONDS + 900))

          while true; do
            if ! invocation=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$BACKEND_EC2_INSTANCE_ID" 2>/dev/null); then
              if (( SECONDS >= deadline )); then
                echo "::error::SSM 명령 조회 제한 시간을 초과했습니다."
                exit 1
              fi

              sleep 5
              continue
            fi

            status=$(jq -r '.Status' <<< "$invocation")
            echo "SSM 상태: $status"

            case "$status" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                jq -r '.StandardOutputContent' <<< "$invocation"
                jq -r '.StandardErrorContent' <<< "$invocation" >&2
                echo "::error::SSM 배포가 실패했습니다. status=$status"
                exit 1
                ;;
              Pending|InProgress|Delayed)
                ;;
              *)
                echo "::warning::알 수 없는 SSM 상태입니다: $status"
                ;;
            esac

            if (( SECONDS >= deadline )); then
              echo "::error::SSM 배포 제한 시간을 초과했습니다."
              exit 1
            fi

            sleep 5
          done

          jq -r '.StandardOutputContent' <<< "$invocation"
          jq -r '.StandardErrorContent' <<< "$invocation" >&2
