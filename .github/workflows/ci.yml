name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gradle-check:
    name: Gradle check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Run Gradle check
        run: ./gradlew clean check bootJar --no-daemon

      - name: Verify automation and coverage output
        run: |
          node --test .github/scripts/git-conventions.test.cjs .github/scripts/pending-workflows.test.cjs
          test -s build/reports/jacoco/test/jacocoTestReport.xml
          test -s build/reports/jacoco/test/html/index.html

      - name: Publish JaCoCo report to PR (informational)
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: madrapps/jacoco-report@50d3aff4548aa991e6753342d9ba291084e63848 # v1.7.2
        with:
          title: "테스트 커버리지"
          paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jacoco-report
          path: |
            build/reports/jacoco/test/html/
            build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: error
          retention-days: 14
