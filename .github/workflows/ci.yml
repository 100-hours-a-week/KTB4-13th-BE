name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gradle-check:
    name: Gradle check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Run Gradle check
        run: ./gradlew clean check bootJar --no-daemon

      - name: Verify automation and coverage output
        run: |
          node --test .github/scripts/git-conventions.test.cjs .github/scripts/pending-workflows.test.cjs
          test -s build/reports/jacoco/test/jacocoTestReport.xml
          test -s build/reports/jacoco/test/html/index.html

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jacoco-report
          path: |
            build/reports/jacoco/test/html/
            build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: error
          retention-days: 14

  publish-image:
    name: Publish backend image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_CI_ROLE_ARN: ${{ vars.AWS_CI_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate image publishing configuration
        run: |
          for name in AWS_REGION AWS_CI_ROLE_ARN ECR_REPOSITORY; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Variable $name 값이 없습니다."
              exit 1
            fi
          done

          [[ "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]]
          [[ "$ECR_REPOSITORY" =~ ^[A-Za-z0-9._/-]+$ ]]

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Build and push Docker image
        env:
          BACKEND_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker compose -f compose.build.yml build backend
          docker compose -f compose.build.yml push backend

  notify-failure:
    name: Notify CI failure
    if: ${{ always() && (needs.gradle-check.result == 'failure' || needs.publish-image.result == 'failure') }}
    needs: [gradle-check, publish-image]
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo 'DISCORD_WEBHOOK_URL secret is not configured; skipping external alert.'
            exit 0
          fi
          payload=$(jq -n --arg content "🚨 Backend CI 실패\n저장소: $GITHUB_REPOSITORY\n커밋: $GITHUB_SHA\n로그: $RUN_URL" '{content: $content}')
          curl --fail-with-body --silent --show-error -H 'Content-Type: application/json' --data "$payload" "$DISCORD_WEBHOOK_URL"
