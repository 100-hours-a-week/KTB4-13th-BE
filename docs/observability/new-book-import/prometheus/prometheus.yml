global:
  scrape_interval: 5s

scrape_configs:
  - job_name: book
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:18081"]
        labels:
          instance_name: instance-a
      - targets: ["host.docker.internal:18082"]
        labels:
          instance_name: instance-b
