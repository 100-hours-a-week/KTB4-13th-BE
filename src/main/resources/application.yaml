# 연결 IP는 애플리케이션에서 신뢰 프록시를 확인한 뒤 해석합니다.
server:
  forward-headers-strategy: none

spring:
  application:
    name: book
  profiles:
    default: local
  config:
    import: classpath:persistence.yml,classpath:ai.yml

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: never
      show-details: never

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}

app:
  request-ip:
    trusted-proxies: ${TRUSTED_PROXY_CIDRS:}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:false}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI}
  token:
    secret: ${JWT_SECRET}
    access-token-expiration: 1h
    refresh-token-expiration: 7d
