spring:
  application:
    name: book
  profiles:
    default: local
  config:
    import: classpath:persistence.yml,classpath:ai.yml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 2000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        # AI 프로필 메시지 값 한도(8MiB)에 레코드 머리글 여유(64KiB)를 더합니다. 브로커·토픽 한도도 이 값 이상이어야 합니다.
        max.request.size: 8454144
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      properties:
        allow.auto.create.topics: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 1s
      connect-timeout: 1s
      repositories:
        enabled: false

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        product.inventory.redis.lock.acquire: true
  endpoint:
    health:
      show-components: never
      show-details: never

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}

app:
  new-book:
    enabled: ${NEW_BOOK_IMPORT_ENABLED:false}
    national-library-key: ${NATIONAL_LIBRARY_ISBN_API_KEY:}
    data-for-library-key: ${DATA_FOR_LIBRARY_API_KEY:}
    detail-daily-limit: ${DATA_FOR_LIBRARY_DAILY_LIMIT:500}
  profile-sync:
    ai-kafka-enabled: ${PROFILE_SYNC_AI_KAFKA_ENABLED:false}
    kafka-enabled: ${PROFILE_SYNC_KAFKA_ENABLED:false}
    kafka-group-id: ${PROFILE_SYNC_KAFKA_GROUP_ID:book-profile-sync-v1}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  product:
    inventory:
      redis-lock:
        enabled: ${PRODUCT_INVENTORY_REDIS_LOCK_ENABLED:false}
  shelf-photo:
    bucket: ${SHELF_PHOTO_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}

auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:false}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    admin-key: ${KAKAO_ADMIN_KEY:}
    redirect-uri: ${KAKAO_REDIRECT_URI}
  token:
    secret: ${JWT_SECRET}
    access-token-expiration: 1h
    refresh-token-expiration: 7d

# 테스트: 개발자센터의 test_sk_... 값을 TOSS_PAYMENTS_SECRET_KEY 환경변수로 제공합니다.
# 시크릿 키를 이 파일에 직접 저장하지 않습니다.
payment:
  toss:
    base-url: ${TOSS_PAYMENTS_BASE_URL:https://api.tosspayments.com}
    secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}
    connect-timeout-ms: 3000
    read-timeout-ms: 10000

coupon:
  cache:
    ttl-ms: ${COUPON_CACHE_TTL_MS:10000}
    fresh-ms: ${COUPON_CACHE_FRESH_MS:500}
  sold-out:
    ttl-seconds: ${COUPON_SOLD_OUT_TTL_SECONDS:86400}
    fast-path-ttl-ms: ${COUPON_SOLD_OUT_FAST_PATH_TTL_MS:1000}
  issuance:
    stream: "coupon:issuance:kafka-outbox"
  kafka:
    topic: book.coupon-issuance.redis.v1

preference:
  nightly:
    concurrency: ${PREFERENCE_NIGHTLY_CONCURRENCY:1}
