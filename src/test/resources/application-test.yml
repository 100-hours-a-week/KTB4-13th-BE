spring:
  datasource:
    url: jdbc:h2:mem:book-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1;INIT=SET TIME ZONE 'UTC'
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.jdbc.time_zone: UTC
  sql:
    init:
      mode: always
      schema-locations: classpath:h2-test-schema.sql
      data-locations: classpath:h2-test-data.sql


auth:
  cookie:
    secure: false
  kakao:
    rest-api-key: test-kakao-rest-api-key
    client-secret: test-kakao-client-secret
    admin-key: test-kakao-admin-key
    redirect-uri: http://localhost:3000/oauth/kakao/callback
  token:
    secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZg==
    access-token-expiration: 1h
    refresh-token-expiration: 7d

app:
  user-withdrawal:
    cron: "-"
